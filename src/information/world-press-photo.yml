- key: No Woman's Land 7
  reeks: No Woman's Land
  nummer: 7
  web: https://www.worldpressphoto.org/collection/photo-contest/2025/Kiana-Hayeri/7
  maker: Kiana Hayeri
  comment:
    nl: Ik heb de harde foto's met mensen in beeld uit de World Press Photo tentoonstelling niet gefotografeerd uit eerbied. Met deze foto hoefde ik geen mensen te trekken. De sfeer van ontmenselijking en geweld op mensen is in dit land nu zo extreem dat dit wordt doorgetrokken naar dingen enkel en alleen omdat ze op mensen lijken. Het is het Afghanistan onder de taliban.
    en: I did not photograph the hardest photo's of people on the World Press Photo exhibition out of respect. With this picture I didn't had to photograph people. The atmosphere of extreme violence and dehumanisation in this country is so extreme that is extended to objects only because they look like humans. This is current day Afghanistan under the taliban.
- key: Droughts in the Amazon
  reeks: Droughts in the Amazon
  nummer:
  maker: Musuk Nolte
  web: https://www.worldpressphoto.org/collection/photo-contest/2025/Musuk-Nolte/1
  comment:
    nl: Omdat ik de te harde foto's niet heb gefotografeerd, gaat de derde foto die ik heb getrokken op de de World Press Photo 2025 tentoonstelling ook over de gevolgen van de klimaatsopwarming. De man is steekt een rivier in het Amazone-gebied over in Brazilië. Zo extreem is de droogte. Het is het grootste regenwoud en het lijkt bijna op een woestijn door de extreme droogte.
    en: Because I did not photograph the photos that are to hard, the third picture on the exhibition of the World Press Photo 2025 is a man that crosses a "river" in the Amazon in Brazil. It is this extreme. It is the biggest rainforest and it has almost the look of a desert because of the extreme drought.
- key: Aircraft on Flooded Tarmac
  reeks: Aircraft on Flooded Tarmac
  nummer:
  maker: Anselmo Cunha
  web: https://www.worldpressphoto.org/collection/photo-contest/2025/Anselmo-Cunha/1
  comment:
    nl: Ik heb de foto genomen omdat het erg mooi is. We mogen niet vergeten dat het issue dat de fotograaf onder de aandacht wilt brengen echter erg zorgwekkend blijf, ook al probeert de samenleving te doen alsof er niets aan de hand is voor de gemoedsrust op korte termijn. Hij is genomen na een overstroming door extreme regenval door de opwarming van de aarde in Brazilië.
    en: Without context this picture is just very beautiful. We should be conscious that hte issue the photographer wanted us to make us aware of is still very worrisome, even society tries to ignore it to ease the mind on the short term. It is taken after a flood because extreme rainfall due to global heating in Brazil.
